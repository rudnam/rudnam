name: Profile stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/stats.yml]

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render cards
        run: node scripts/stats.mjs dist
        env:
          # Read-only token that can see private repos; GITHUB_TOKEN only sees this repo.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN }}
      # Force-push to an orphan branch so main doesn't collect a commit per run.
      - name: Publish to output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Update stats"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
